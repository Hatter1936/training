<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис финансового прогнозирования для малого бизнеса</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside>
        <img src="./assets/images/logo.png">
        <ul style="margin-bottom: 100px;">
            <li><a href="index.html">Главная</a></li>
            <li><a href="forecast.html">Прогноз</a></li>
            <li><a href="history.html">История</a></li>
            <li style="background-color: var(--lightgray)";>
            <a href="analytics.html">Аналитика</a></li>
        </ul>
        <div>
            <a href="#" id="openLogin">Войти</a>
            <a href="#" id="openRegister">Регистрация</a>
        </div>
    </aside>

    <section class="article">
    <div style="position: relative; height: 400px; width: 100%;">
        <canvas id="pieChart" ></canvas>
    </div>
    <table class="chart-table">
            <tbody>
            </tbody>
        </table>
    </section>

    <section class="article">
        <div style="position: relative; height: 400px; width: 100%;">
            <canvas id="barChart"></canvas>
        </div>
    </section>

    <dialog id="LoginModal">
    <button class="article-close" id="closeLogin">x</button>
    <h3>Вход</h3>
    <div class="dialog-form">
        <div class="dialog-form-field">
            <p>Email</p>
            <input id="loginEmail" class="dialog-input-text" type="email" placeholder="example@mail.ru">
        </div>
        <div class="dialog-form-field">
            <p>Пароль</p>
            <input id="loginPassword" class="dialog-input-text" type="password" placeholder="••••••••">
        </div>
    </div>
    <button class="dialog-button" id="LoginBtn">Войти</button>
    <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        Нет аккаунта?
        <a href="#" id="toRegister" style="color: var(--primary-hover); text-decoration: none;">Зарегистрироваться</a>
    </p>
</dialog>
<dialog id="RegisterModal">
    <button class="article-close" id="closeRegister">x</button>
    <h3>Регистрация</h3>
    <div class="dialog-form">
        <div class="dialog-form-field">
            <p>Email</p>
            <input id="registerEmail" class="dialog-input-text" type="email" placeholder="example@mail.ru">
        </div>
        <div class="dialog-form-field">
            <p>Пароль</p>
            <input id="registerPassword" class="dialog-input-text" type="password" placeholder="••••••••">
        </div>
        <div class="dialog-form-field">
            <p>Повторите пароль</p>
            <input id="registerPasswordRepeat" class="dialog-input-text" type="password" placeholder="••••••••">
        </div>
        <div class="dialog-form-field">
            <p>ИНН</p>
            <input id="registerINN" class="dialog-input-text" type="text" inputmode="numeric" maxlength="12" placeholder="1234567890">
        </div>
    </div>
    <button class="dialog-button" id="RegisterBtn">Зарегистрироваться</button>
    <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        Уже есть аккаунт?
        <a href="#" id="toLogin" style="color: var(--primary-hover); text-decoration: none;">Войти</a>
    </p>
</dialog>
    
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/chart.umd.js"></script>
    <script src="js/main.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
